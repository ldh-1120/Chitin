name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Chitin
        uses: actions/checkout@v4

      - name: Checkout Cascade
        uses: actions/checkout@v4
        with:
          repository: ldh-1120/Cascade
          path: Cascade

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish Cascade locally
        working-directory: Cascade
        run: ./gradlew publishToMavenLocal

      - name: Build Chitin
        run: ./gradlew build
